name: CI

# Intégration continue du projet Lupistar.
# Pour l'instant, la CI contient une seule étape : le "lint" (contrôle du style
# de code PHP avec Laravel Pint). D'autres jobs (tests, analyse statique...)
# pourront être ajoutés ici par la suite.
on:
  push:
    branches: [ main, release ]
  pull_request:
    branches: [ main, release ]

jobs:
  lint:
    name: Lint — style du code (Laravel Pint / PSR-12)
    runs-on: ubuntu-latest
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - name: Installation des dépendances
        working-directory: lupistar-laravel
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Vérification du style avec Laravel Pint
        working-directory: lupistar-laravel
        run: ./vendor/bin/pint --test

  # Étape de tests à activer lorsque des tests automatisés seront ajoutés :
  # tests:
  #   name: Tests (PHPUnit)
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - run: php artisan test
